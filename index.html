<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AiiArt.com is for sale</title>
<meta name="description" content="The domain name AiiArt.com is for sale. Buy now for USD $59,999.">
<meta property="og:title" content="AiiArt.com is for sale">
<meta property="og:description" content="Buy now for USD $59,999.">
<style>
  :root {
    --bg: #0b1020;
    --bg-2: #121a33;
    --card: #ffffff;
    --ink: #0b1020;
    --ink-soft: #4a5370;
    --line: #e4e7ef;
    --field: #f6f8fb;
    --accent: #2ee6c5;
    --ok: #0f7a5f;
    --ok-bg: #e7f8f2;
    --err: #b42318;
    --err-bg: #fdecea;
    --on-dark: #eef1fa;
    --on-dark-soft: #9aa4c4;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background:
      radial-gradient(1200px 600px at 85% -10%, rgba(46, 230, 197, 0.16), transparent 60%),
      radial-gradient(900px 500px at -10% 110%, rgba(110, 120, 255, 0.18), transparent 60%),
      linear-gradient(160deg, var(--bg), var(--bg-2));
    color: var(--on-dark);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
  }
  .arc {
    position: fixed;
    inset: auto -20vw -55vw auto;
    width: 110vw;
    height: 110vw;
    border-radius: 50%;
    border: 1px solid rgba(46, 230, 197, 0.18);
    pointer-events: none;
  }
  .arc.two { inset: auto -35vw -70vw auto; width: 140vw; height: 140vw; border-color: rgba(154, 164, 196, 0.10); }
  main {
    flex: 1;
    width: 100%;
    max-width: 1080px;
    margin: 0 auto;
    padding: 72px 24px 48px;
    display: grid;
    grid-template-columns: 1.15fr 1fr;
    gap: 48px;
    align-items: center;
    position: relative;
    z-index: 1;
  }
  .eyebrow {
    font-size: 15px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--on-dark-soft);
    margin: 0 0 18px;
  }
  h1 {
    font-size: clamp(48px, 9vw, 96px);
    line-height: 1;
    letter-spacing: -0.03em;
    margin: 0;
    font-weight: 700;
    overflow-wrap: anywhere;
  }
  h1 .dot { color: var(--accent); }
  .sale {
    font-size: clamp(22px, 3vw, 30px);
    margin: 20px 0 0;
    font-weight: 600;
  }
  .card {
    background: var(--card);
    color: var(--ink);
    border-radius: 18px;
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.35);
    overflow: hidden;
  }
  .card-head { padding: 26px 28px 18px; }
  .card-head h2 { margin: 0 0 6px; font-size: 26px; letter-spacing: -0.01em; }
  .card-head p { margin: 0; color: var(--ink-soft); font-size: 16px; line-height: 1.5; }
  .price {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    padding: 20px 28px;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    background: var(--field);
  }
  .price span { font-size: 16px; font-weight: 600; color: var(--ink-soft); }
  .price strong { font-size: 30px; letter-spacing: -0.01em; white-space: nowrap; }
  .escrow {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 14px 28px;
    border-bottom: 1px solid var(--line);
    font-size: 14px;
    line-height: 1.45;
    color: var(--ink-soft);
  }
  .escrow svg { flex: none; margin-top: 1px; color: var(--ok); }
  .escrow strong { color: var(--ink); font-weight: 600; }
  .escrow a { color: var(--ink); font-weight: 600; text-decoration: none; border-bottom: 1px solid var(--line); }
  .escrow a:hover { border-bottom-color: var(--ink); }
  form { padding: 22px 28px 26px; }
  .form-title { margin: 0 0 14px; font-size: 17px; font-weight: 650; }
  label { display: block; font-size: 14px; font-weight: 600; margin: 0 0 6px; }
  label .opt { font-weight: 400; color: var(--ink-soft); }
  .field { margin: 0 0 14px; }
  input[type="text"], input[type="email"], textarea {
    width: 100%;
    font: inherit;
    font-size: 16px;
    color: var(--ink);
    background: var(--field);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px;
    transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
  }
  textarea { min-height: 112px; resize: vertical; line-height: 1.45; }
  input:focus, textarea:focus {
    outline: none;
    background: #fff;
    border-color: var(--ink);
    box-shadow: 0 0 0 3px rgba(46, 230, 197, 0.35);
  }
  .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
  .btn {
    display: block;
    width: 100%;
    padding: 15px 20px;
    border: 0;
    border-radius: 12px;
    background: var(--ink);
    color: #fff;
    font: inherit;
    font-size: 17px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s ease, background 0.15s ease, opacity 0.15s ease;
  }
  .btn:hover { background: #1c2547; transform: translateY(-1px); }
  .btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  .btn[disabled] { opacity: 0.6; cursor: progress; transform: none; }
  .status {
    margin: 14px 0 0;
    padding: 12px 14px;
    border-radius: 10px;
    font-size: 15px;
    line-height: 1.45;
    display: none;
  }
  .status.ok { display: block; color: var(--ok); background: var(--ok-bg); }
  .status.err { display: block; color: var(--err); background: var(--err-bg); }
  .note { margin: 12px 0 0; font-size: 13px; color: var(--ink-soft); text-align: center; }
  footer {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 24px 16px 32px;
    font-size: 13px;
    color: var(--on-dark-soft);
  }
  @media (max-width: 820px) {
    main { grid-template-columns: 1fr; gap: 32px; padding: 48px 16px 32px; }
    .card-head, .price, .escrow, form { padding-left: 20px; padding-right: 20px; }
    .price strong { font-size: 26px; }
  }
</style>
</head>
<body>
  <div class="arc" aria-hidden="true"></div>
  <div class="arc two" aria-hidden="true"></div>

  <main>
    <section>
      <p class="eyebrow">The domain name</p>
      <h1>AiiArt<span class="dot">.</span>com</h1>
      <p class="sale">is for sale.</p>
    </section>

    <section class="card" aria-label="Purchase">
      <div class="card-head">
        <h2>Get this domain</h2>
        <p>Own AiiArt.com for USD $59,999.</p>
      </div>
      <div class="price">
        <span>Buy now</span>
        <strong>USD $59,999</strong>
      </div>
      <div class="escrow">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>
        <span><strong>Secure payment through <a href="https://www.escrow.com" target="_blank" rel="noopener noreferrer">Escrow.com</a>.</strong> The buyer pays the escrow fee.</span>
      </div>

      <form id="contact-form" novalidate>
        <p class="form-title">Contact the owner</p>
        <div class="field">
          <label for="name">Name <span class="opt">(optional)</span></label>
          <input id="name" name="name" type="text" autocomplete="name" maxlength="120">
        </div>
        <div class="field">
          <label for="email">Your email</label>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required maxlength="200">
        </div>
        <div class="field">
          <label for="message">Message</label>
          <textarea id="message" name="message" placeholder="Tell us about your interest in AiiArt.com." required maxlength="5000"></textarea>
        </div>
        <!-- Spam trap: people never see or tick this box; bots often do. -->
        <div class="hp" aria-hidden="true">
          <label for="botcheck">Leave this empty</label>
          <input id="botcheck" name="botcheck" type="checkbox" tabindex="-1" autocomplete="off">
        </div>
        <button class="btn" id="submit-btn" type="submit">Send message</button>
        <p class="status" id="status" role="status" aria-live="polite"></p>
        <p class="note">Your message goes straight to the owner by email.</p>
      </form>
    </section>
  </main>

  <footer>&copy; 2026 AiiArt.com</footer>

  <script>
    // Free form-to-email service: https://formsubmit.co (no account). FORM_ID is the random
    // string FormSubmit gave after activation; it stands in for the owner's email address,
    // which therefore never appears in this page.
    var FORM_ID = "f69b461cf3c7e37faef4d6a5c86a50e8";

    var form = document.getElementById("contact-form");
    var statusEl = document.getElementById("status");
    var button = document.getElementById("submit-btn");

    function show(kind, text) {
      statusEl.className = "status " + kind;
      statusEl.textContent = text;
    }

    form.addEventListener("submit", function (event) {
      event.preventDefault();
      var email = form.email.value.trim();
      var message = form.message.value.trim();

      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        show("err", "Please enter a valid email address so the owner can reply.");
        form.email.focus();
        return;
      }
      if (message.length < 2) {
        show("err", "Please write a short message.");
        form.message.focus();
        return;
      }
      if (form.botcheck.checked) {
        return;
      }
      button.disabled = true;
      button.textContent = "Sending...";
      statusEl.className = "status";

      fetch("https://formsubmit.co/ajax/" + FORM_ID, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Accept": "application/json" },
        body: JSON.stringify({
          name: form.name.value.trim(),
          email: email,
          message: message,
          _replyto: email,
          _subject: "AiiArt.com purchase inquiry",
          _template: "table",
          _captcha: "false",
          _honey: ""
        })
      })
        .then(function (response) { return response.json(); })
        .then(function (data) {
          if (data && (data.success === true || data.success === "true")) {
            form.reset();
            show("ok", "Thank you. Your message has been sent, and the owner will reply by email.");
          } else {
            show("err", "Sorry, the message could not be sent. Please try again in a few minutes.");
          }
        })
        .catch(function () {
          show("err", "Sorry, the message could not be sent. Please check your connection and try again.");
        })
        .finally(function () {
          button.disabled = false;
          button.textContent = "Send message";
        });
    });
  </script>
</body>
</html>
